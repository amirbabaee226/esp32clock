<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست گیج سرعت ساده</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .gauge {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(green 0% 50%, yellow 50% 80%, red 80% 100%);
            margin: 0 auto;
            position: relative;
        }
        .needle {
            position: absolute;
            left: 50%;
            bottom: 50%;
            width: 4px;
            height: 90px;
            background: black;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 0.5s;
        }
        .speed {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>گیج سرعت ساده</h1>
    <div class="gauge">
        <div class="needle" id="needle"></div>
    </div>
    <div class="speed">سرعت: <span id="speed">0</span> km/h</div>
    <input type="range" min="0" max="200" value="0" id="slider">
    
    <script>
        const needle = document.getElementById('needle');
        const speedSpan = document.getElementById('speed');
        const slider = document.getElementById('slider');
        
        slider.addEventListener('input', function() {
            const speed = this.value;
            const rotation = speed * 180 / 200 - 90; // تبدیل سرعت به درجه (-90 تا 90)
            needle.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
            speedSpan.textContent = speed;
        });
    </script>
</body>
</html>
